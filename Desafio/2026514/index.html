<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contador Exemplo</title>
        <link rel="stylesheet" href="style.css">
        <script defer src="script.js"></script>
    </head>
    <body>
        <h1>Contador funcionando aqui</h1>
        <span>Valor atual:</span>
        <p id="valor">0</p>
        <button id="btn-mais">+</button>
        <button id="btn-mais10">+ 10</button>
        <button id="btn-menos">-</button>
        <button id="btn-menos10">- 10</button>
        <button id="btn-reset">Reset</button>
        <p id="mensagem">Não vai abaixo de zero! (if protege)</p>   
    </body>
</html>
